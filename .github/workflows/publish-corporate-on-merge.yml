---
name: Publish Corporate Website

on:
  push:
    paths:
      - "corporate/**"
      - "components/**"
      - "!**/**.md"
    branches:
      - main
  workflow_dispatch:
    inputs:
      env:
        description: 'Environment (production, staging)'
        required: true
        type: choice
        options:
          - production
          - staging
        default: staging
      corporate:
        description: 'Corporate: Branch to deploy (default: main)'
        required: false
        default: main

permissions:
  checks: write
  contents: read

# Concurrency groups are repository-wide, not per-workflow: sharing a group with
# the other publish workflow made a merge touching both projects cancel one of
# the two deploys.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

env:
  PROJECT_PATH: 'corporate'
  environment: ${{ github.event.inputs.env || 'staging' }}
  corporate: ${{ github.event.inputs.corporate || 'main' }}

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.corporate }}

      - uses: kanga333/variable-mapper@master
        with:
          key: "${{ env.environment }}"
          map: |
            {
              "production": {
                "google_project_id": "${{ vars.GOOGLE_PROJECT_ID_PROD }}",
                "bucket_name": "${{ vars.GCS_CORPORATE_BUCKET_NAME_PROD }}",
                "service_account__secret_name": "GOOGLE_STORAGE_SERVICE_ACCOUNT_ZATSIT_CORPORATE_PROD"
              },
              "staging": {
                "google_project_id": "${{ vars.GOOGLE_PROJECT_ID_DEV }}",
                "bucket_name": "${{ vars.GCS_CORPORATE_BUCKET_NAME_STAGING }}",
                "service_account__secret_name": "GOOGLE_STORAGE_SERVICE_ACCOUNT_ZATSIT_CORPORATE_STAGING"
              }
            }

      - name: Fetch and Build content
        uses: ./.github/actions/astro
        with:
          token: ${{ secrets.GH_PAT }}
          branch: ${{ env.corporate }}
          project-path: ${{ env.PROJECT_PATH }}
          build-env: "${{ env.environment == 'production' && vars.CORPORATE_BUILD_ENV || vars.CORPORATE_STAGING_BUILD_ENV }}"

      - uses: 'google-github-actions/auth@v2'
        with:
          project_id: ${{ env.google_project_id }}
          credentials_json: ${{ secrets[env.service_account__secret_name] }}

      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v2'

      # Incremental publish. The steps this replaces deleted every object of the
      # bucket and only then uploaded the new build, so the site answered 404 for
      # the whole duration of the upload. rsync overwrites changed objects in
      # place and prunes the orphans at the end, so no request ever lands on an
      # empty bucket.
      - name: Publish to Cloud Storage
        run: |
          gcloud storage rsync corporate/dist "gs://${{ env.bucket_name }}" \
            --recursive \
            --delete-unmatched-destination-objects \
            --cache-control="public, max-age=300, stale-while-revalidate=86400"
          # Astro fingerprints the file names it emits under /_astro, so that
          # content is safe to cache for a year. Pages keep the short TTL set
          # above, which makes a deploy visible within minutes.
          gcloud storage objects update "gs://${{ env.bucket_name }}/_astro/**" \
            --cache-control="public, max-age=31536000, immutable"

      # needed to avoid the post action error
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
